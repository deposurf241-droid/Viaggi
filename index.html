<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#063f51"><meta name="description" content="Diario personale dei viaggi e delle spese"><link rel="icon" href="assets/icon-192.png?v=3p-turchese-identica-v2" type="image/png"><link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png?v=3p-turchese-identica-v2"><link rel="manifest" href="manifest.webmanifest?v=3p-turchese-identica-v2"><title>Viaggi · Around the World</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css?v=3p-fix-safari-nov18-v3"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzxjPYO4z0tC5XqJ8wS7xU8=" crossorigin=""><script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script><script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script><script>
(function(){
  var complete=false;
  function showFailure(message){
    if(complete)return;
    var app=document.getElementById('app');
    if(!app || !app.querySelector('.loading')) { complete=true; return; }
    var safe=String(message||'Impossibile avviare l’app.').replace(/[<>&]/g,'');
    app.innerHTML='<main style="max-width:520px;margin:42px auto;padding:28px 24px;background:#fffaf0;border-radius:20px;color:#17304b;font:16px system-ui;line-height:1.5"><h2>✈️ Problema di caricamento</h2><p>Non sono stati toccati i tuoi viaggi su Firebase.</p><p style="overflow-wrap:anywhere;font-size:14px">'+safe+'</p><p>Apri direttamente in Safari e aggiorna la pagina. Se persiste, mandami una foto di questo messaggio.</p><button style="padding:12px 20px;border:0;border-radius:10px;background:#17304b;color:white" onclick="location.reload()">Riprova</button></main>';
    complete=true;
  }
  window.addEventListener('error',function(e){
    if(document.querySelector('#app .loading'))showFailure(e.message || 'File JavaScript non caricato');
  },true);
  window.addEventListener('unhandledrejection',function(e){
    if(document.querySelector('#app .loading'))showFailure((e.reason&&e.reason.message)||'Errore di inizializzazione');
  });
  window.addEventListener('load',function(){
    setTimeout(function(){if(document.querySelector('#app .loading'))showFailure('L’app non è stata avviata: file non aggiornati o JavaScript bloccato.');},6500);
  });
})();
</script><script type="module" src="app.js?v=3p-fullscreen-position-fix-v1"></script></head><body><div id="app"><main class="loading">✈️ Prepariamo il tuo diario...</main></div><div id="toast" role="status" aria-live="polite"></div></body></html>
